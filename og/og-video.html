var tickW=0;
function cl(x){return x<0?0:x>1?1:x}
function seg(t,a,b){return cl((t-a)/(b-a))}
function eo(x){return 1-Math.pow(1-x,3)}
function eio(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}
function spr(x){return x<=0?0:x>=1.6?1:1-Math.exp(-6.5*x)*Math.cos(9*x)}
function op(t,a){return cl((t-a)/.25)}
var segs=[].slice.call(document.querySelectorAll('#prog u'));
function render(t){
  if(!tickW)tickW=$('tickIn').scrollWidth/4;
  for(var i=0;i<SC.length;i++){
    var a=SC[i][0],b=SC[i][1],dx=SC[i][2],dy=SC[i][3];
    var s=$('s'+i), o=i===0?cl(t/.4):cl((t-a)/.3);

    // continuous push-in across the scene's window (plus its crossfade tail)
    var k=cl((t-a)/(b-a+.3)); if(i===SC.length-1)k=cl((t-a)/2.2);
    var sc=1.12-0.1*k;

    segs[i].style.transform='scaleX('+seg(t,a,i===SC.length-1?8:SC[i+1][0]).toFixed(4)+')';
    var next=i===SC.length-1?99:SC[i+1][0];
    var co=cl((t-a-.15)/.25)*(1-cl((t-next-.05)/.2));
    var c=$('c'+i);c.style.opacity=co.toFixed(3);c.style.transform='translate3d(0,'+((1-eo(cl((t-a-.15)/.5)))*8).toFixed(2)+'px,0)';
  }

  var ey=$('eye');ey.style.opacity=op(t,.55);ey.style.transform='translate3d(0,'+((1-eo(seg(t,.55,1.3)))*14).toFixed(2)+'px,0)';
  [['l1',.7],['l2',.85]].forEach(function(a){$(a[0]).firstChild.style.transform='translate3d(0,'+((1-eo(seg(t,a[1],a[1]+.9)))*110).toFixed(2)+'%,0)'});

  $('tick').style.opacity=op(t,1.2);
  var px=Math.round(t*60)%Math.round(tickW);
  $('tickIn').style.transform='translate3d('+(-px)+'px,0,0)';

  $('tb').style.transform='translate3d(0,'+((1-bb)*90).toFixed(2)+'px,0)';

}
