<script>
var TM={"top": 64, "bot": 744, "fh": 13.333333333333334};
var $=function(id){return document.getElementById(id)};
var T=' 65 BAY STREET <i>◆</i> JERSEY CITY, NJ 07302 <i>◆</i> NO SECURITY DEPOSIT REQUIRED <i>◆</i> 0.5 MI TO EXCHANGE PLACE PATH <i>◆</i> STUDIOS TO TWO-BEDROOMS, FLOORS 3–51 <i>◆</i> (855) 999-1087 <i>◆</i>';
$('tickIn').innerHTML=T+T+T+T;
var tickW=0;
var lyrs=[].slice.call(document.querySelectorAll('#view .lyr')).map(function(g){return{g:g,k:+g.getAttribute('data-k')}});
var tls=[].slice.call(document.querySelectorAll('#tower .tl'));
var blinks=[].slice.call(document.querySelectorAll('#view .blink'));
var ferry=$('vFerry');
function cl(x){return x<0?0:x>1?1:x}
function seg(t,a,b){return cl((t-a)/(b-a))}
function eo(x){return 1-Math.pow(1-x,3)}
function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function spr(x){return x<=0?0:x>=1.6?1:1-Math.exp(-6.5*x)*Math.cos(9*x)}
function op(t,a){return cl((t-a)/.25)}
function render(t){
  if(!tickW)tickW=$('tickIn').scrollWidth/4;
  // card + tower
  var c=spr(seg(t,0,1.4)*1.6);
  var cs='translate3d(0,'+((1-c)*36).toFixed(2)+'px,0) scale('+(0.96+0.04*c).toFixed(4)+')';
  ['card','tower','win','badge'].forEach(function(id){var e=$(id);e.style.opacity=op(t,0);e.style.transform=cs});
  var dl=eo(seg(t,.3,1.8));
  tls.forEach(function(p){p.style.strokeDasharray=800;p.style.strokeDashoffset=(800*(1-dl)).toFixed(1)});
  // copy
  $('logo').style.opacity=op(t,.35);$('logo').style.transform='translate3d(0,'+((1-eo(seg(t,.35,1.1)))*16).toFixed(2)+'px,0)';
  $('eye').style.opacity=op(t,.5);$('eye').style.transform='translate3d(0,'+((1-eo(seg(t,.5,1.2)))*16).toFixed(2)+'px,0)';
  [['l1',.6],['l2',.75],['l3',.9]].forEach(function(a){$(a[0]).firstChild.style.transform='translate3d(0,'+((1-eo(seg(t,a[1],a[1]+.9)))*110).toFixed(2)+'%,0)'});
  // ride
  var f=1+43*eio(seg(t,1.6,4.6));
  var y=TM.bot-(f-1)*TM.fh;
  $('tRow').setAttribute('transform','translate(0 '+y.toFixed(2)+')');
  $('tCar').setAttribute('transform','translate(0 '+y.toFixed(2)+')');
  var h=(f-1)/51;
  lyrs.forEach(function(l){l.g.setAttribute('transform','translate(0 '+(h*l.k).toFixed(1)+')')});
  var n=Math.round(f);$('fl').textContent=n===1?'L':n;
  ferry.setAttribute('transform','translate('+(-80+t*26).toFixed(2)+' 0)');
  blinks.forEach(function(b,i){b.setAttribute('opacity',(Math.floor(t/1.2+i*.5)%2)?'.2':'1')});
  // rows
  [].forEach.call(document.querySelectorAll('.row'),function(r,i){var a=4.5+i*.18;r.style.opacity=op(t,a);r.style.transform='translate3d(0,'+((1-eo(seg(t,a,a+.6)))*14).toFixed(2)+'px,0)'});
  // ticker
  $('tick').style.opacity=op(t,1.2);
  var px=Math.round(t*60)%Math.round(tickW);
  $('tickIn').style.transform='translate3d('+(-px)+'px,0,0)';
  // tab bar
  var b=spr(seg(t,5.9,7.5)*1.6);
  $('tb').style.transform='translate3d(0,'+((1-b)*-0+ (1-b)*90).toFixed(2)+'px,0)';
  
  $('tb').style.opacity=op(t,5.9);
  [].forEach.call($('tb').children,function(ch,i){ch.style.opacity=op(t,6.1+i*.06)});
}
window.render=render;render(0);
</script>
